name: CI

on:
  push:
    branches: [main]
  # Any PR (including the stacked crates.io readiness branches) so
  # feature-to-feature PRs still run fmt/clippy/test/package.
  pull_request:

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to full commit SHA for supply-chain security.
      # Upgraded from v4 SHA (34e11...) to v7 SHA (9c09...) for consistency with coverage.yml
      # (see coverage workflow). This is a security-pinned immutable SHA corresponding to
      # actions/checkout@v7. No submodules, LFS, or custom fetch-depth used in this workflow,
      # so no breaking changes from v5/v6/v7 affect it. Verified against GitHub's official
      # actions/checkout releases.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # Pinned to full commit SHA for dtolnay/rust-toolchain (corresponds to v1 tag, aligned with coverage.yml for consistency)
      # This ensures immutable build behavior and satisfies security scanners.
      # Keep Cargo.toml rust-version, rust-toolchain.toml channel, and this
      # job's toolchain: string identical (MSRV lockstep — GH-41).
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Verify MSRV pins agree
        shell: bash
        run: |
          set -euo pipefail
          strip_cr() { tr -d '\r'; }
          extract_toolchain() {
            local file="$1"
            awk '
              BEGIN { want = 0; in_rt = 0; lines = 0 }
              { sub(/\r$/, "") }
              /^[[:space:]]*- name:[[:space:]]*Install Rust/ { want = 1; next }
              want && /uses: dtolnay\/rust-toolchain@/ { in_rt = 1; next }
              in_rt && /^[[:space:]]*toolchain:[[:space:]]*/ {
                sub(/^[[:space:]]*toolchain:[[:space:]]*/, "")
                sub(/[[:space:]]*$/, "")
                print
                exit 0
              }
              want {
                lines++
                if (lines > 20) exit 1
                if (/^[[:space:]]*- name:/) exit 1
              }
            ' "$file"
          }
          cargo_rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          toolchain_ch=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          ci_rv=$(extract_toolchain .github/workflows/ci.yml | tr -d '"' | strip_cr)
          cov_rv=$(extract_toolchain .github/workflows/coverage.yml | tr -d '"' | strip_cr)
          if [ -z "${ci_rv:-}" ] || [ -z "${cov_rv:-}" ]; then
            echo "ERROR: Failed to extract toolchain: from CI or coverage workflow" >&2
            exit 1
          fi
          echo "Cargo.toml rust-version=$cargo_rv"
          echo "rust-toolchain.toml channel=$toolchain_ch"
          echo "ci.yml pin=$ci_rv"
          echo "coverage.yml pin=$cov_rv"
          if [ "$cargo_rv" != "$toolchain_ch" ] || [ "$cargo_rv" != "$ci_rv" ] || [ "$cargo_rv" != "$cov_rv" ]; then
            echo "ERROR: MSRV pins disagree (must be identical 1.98.1 lockstep)." >&2
            exit 1
          fi

      # Swatinem/rust-cache is used instead of raw actions/cache + static key.
      # It handles Rust-specific caching (including git deps like neuromod) and
      # avoids the Cargo.lock gitignore problem that caused stale caches.
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features

  package:
    name: cargo package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # Keep in lockstep with rust-toolchain.toml / Cargo.toml rust-version (GH-41).
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: cargo package --list
        run: cargo package --list --allow-dirty

      - name: cargo package
        run: cargo package --allow-dirty

      - name: Assert package contents
        run: |
          set -euo pipefail
          list="$(cargo package --list --allow-dirty)"
          required=(
            LICENSE-MIT
            LICENSE-APACHE-2.0
            README.md
            CHANGELOG.md
            Cargo.toml
            src/lib.rs
            src/critic.rs
            examples/generic_environment.rs
            docs/BOUNDARY_MATRIX.md
            REUSE.toml
          )
          forbidden=(
            .github/workflows/ci.yml
            .beads/config.yaml
            .config/nextest.toml
            qodana.yaml
            codecov.yml
            rust-toolchain.toml
            docs/logo.png
            .gitignore
          )
          missing=0
          leaked=0
          for f in "${required[@]}"; do
            if ! printf '%s\n' "$list" | grep -Fxq "$f"; then
              echo "::error::package is missing required path: $f"
              missing=1
            fi
          done
          for f in "${forbidden[@]}"; do
            if printf '%s\n' "$list" | grep -Fxq "$f"; then
              echo "::error::package unexpectedly includes: $f"
              leaked=1
            fi
          done
          if [ "$missing" -ne 0 ] || [ "$leaked" -ne 0 ]; then
            echo "---- package --list ----"
            printf '%s\n' "$list"
            exit 1
          fi
          echo "Package include/exclude checks passed."

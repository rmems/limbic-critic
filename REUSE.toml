version = 1

SPDX-PackageName = "limbic-critic"
SPDX-PackageSupplier = "rmems contributors <https://github.com/rmems>"
SPDX-PackageDownloadLocation = "https://github.com/rmems/limbic-critic"

[[annotations]]
path = ["src/**", "examples/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Limen-Neural contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = [
    "**/*.md",
    "Cargo.toml",
    "Cargo.lock",
    "codecov.yml",
    "qodana.yaml",
    "rust-toolchain.toml",
    ".gitignore",
    ".config/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Limen-Neural contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = [".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Limen-Neural contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["docs/**/*.png", "docs/**/*.jpg", "docs/**/*.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Limen-Neural contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = [".beads/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Limen-Neural contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[package]
name = "limbic-critic"
version = "0.2.0"
edition = "2024"
# Keep in lockstep with rust-toolchain.toml and CI (`toolchain: "1.98.1"`).
rust-version = "1.98.1"
description = "Reward-shaping / modulator-mapping primitive for SNNs (not a full actor-critic)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rmems/limbic-critic"
readme = "README.md"
keywords = ["snn", "neuromodulators", "rl", "reward"]
categories = ["science", "simulation"]
# crates.io surface: licenses, README, CHANGELOG, REUSE, sources, examples,
# and BOUNDARY_MATRIX. Drop agent/CI/dev-only paths and the unused docs logo.
exclude = [
    "/.beads/",
    "/.config/",
    "/.github/",
    "/.gitignore",
    "/codecov.yml",
    "/docs/logo.png",
    "/qodana.yaml",
    "/rust-toolchain.toml",
]

[lib]
name = "limbic_critic"
path = "src/lib.rs"

[dependencies]

[[example]]
name = "generic_environment"
path = "examples/generic_environment.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
